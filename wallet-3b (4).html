<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallet 3b</title>
<style>
  :root { --bg:#fbfbfc; --text:#0e0e1a; --muted:#72727c; --btn:#eeeef0; --green:#1f8a4c; --red:#cf2e2e; --accent:#3a2ff5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#e4e4e9; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--text); display:flex; justify-content:center; }
  .phone { position:relative; width:100%; max-width:396px; min-height:100vh; background:var(--bg); padding:64px 15px 140px; overflow:hidden; }
  svg.ic { fill:none; stroke:var(--text); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }


  header { display:flex; justify-content:space-between; align-items:center; }
  .wallet-pill { display:flex; align-items:center; gap:8px; background:#fff; border-radius:999px; padding:5px 22px 5px 5px; box-shadow:0 3px 14px rgba(0,0,0,.07); font-weight:600; font-size:14px; height:40px; }
  .wallet-pill img { width:37px; height:37px; margin:-3.5px; display:block; }
  .head-actions { display:flex; gap:7px; }
  .circle { width:40px; height:40px; border-radius:50%; background:#fff; display:grid; place-items:center; border:0; box-shadow:0 3px 14px rgba(0,0,0,.07); }
  .circle svg { width:19px; height:19px; }

  .banner { margin-top:17px; height:55px; display:flex; align-items:center; gap:9px; border:1px solid #dedee2; border-radius:20px; padding:0 14px 0 12px; }
  .indic { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .indic i { width:4px; height:4px; border-radius:50%; background:#d5d5da; display:block; }
  .indic b { width:4px; height:13px; border-radius:2px; background:#7c7c86; display:block; }
  .banner .icon { width:33px; height:33px; border-radius:10px; background:#dff3e4; display:grid; place-items:center; }
  .banner .icon span { width:16px; height:16px; border:1.8px solid #2eb35f; border-radius:50%; display:grid; place-items:center; color:#2eb35f; font-size:10px; font-weight:700; }
  .banner .txt { flex:1; }
  .banner .txt b { display:block; font-size:13px; font-weight:600; }
  .banner .txt small { color:var(--muted); font-size:11.5px; }
  .banner .close { background:none; border:0; color:#b4b4bb; font-size:16px; cursor:pointer; }

  .balance { margin-top:19px; font-size:37px; line-height:44px; font-weight:800; letter-spacing:-.6px; white-space:nowrap; }
  .change { margin-top:6px; height:18px; color:var(--green); font-weight:600; font-size:14px; display:flex; align-items:center; gap:7px; }
  .change::before { content:""; border:6px solid transparent; border-bottom:8px solid var(--green); border-top:0; }

  .actions { margin-top:30px; display:grid; grid-template-columns:repeat(4,1fr); gap:15px; text-align:center; }
  .action { border:0; background:none; font:inherit; color:var(--text); cursor:pointer; }
  .action .box { height:52px; border-radius:18px; background:var(--btn); display:grid; place-items:center; margin-bottom:8px; }
  .action.primary .box { background:var(--accent); }
  .action.primary svg { stroke:#fff; }
  .action svg { width:22px; height:22px; }
  .action span { font-size:12.5px; font-weight:500; }

  .section-title { margin-top:26px; height:20px; font-size:14.5px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .section-title svg { width:11px; height:11px; stroke-width:3.2; }

  .token { display:flex; align-items:center; gap:14px; margin-top:22px; height:37px; }
  .logo { position:relative; width:37px; height:37px; flex:none; }
  .logo img { position:absolute; display:block; }
  .logo.t img { width:41.9px; height:41.9px; left:-2.5px; top:-2.5px; }
  .info { flex:1; min-width:0; }
  .info b { display:block; font-size:14.5px; font-weight:600; line-height:18px; }
  .info small { display:block; color:var(--muted); font-size:11.5px; line-height:16px; margin-top:2px; }
  .val { text-align:right; }
  .val b { display:block; font-size:14.5px; font-weight:600; line-height:18px; }
  .val small { display:block; font-size:12px; line-height:16px; margin-top:2px; }
  .up { color:var(--green); } .down { color:var(--red); } .flat { color:var(--muted); }

  .viewall { margin-top:18px; display:inline-flex; align-items:center; gap:14px; height:40px; padding:0 16px; border-radius:999px; background:var(--btn); font-size:14px; font-weight:600; border:0; font-family:inherit; color:var(--text); }
  .viewall svg { width:10px; height:10px; stroke-width:3.2; }

  .perps { margin-top:22px; display:flex; gap:11px; margin-right:-15px; }
  .card { flex:none; width:147px; height:130px; border-radius:20px; background:#eeeef1; padding:18px; }
  .card .logo { width:37px; height:37px; }
  .card .logo img { width:45.3px; height:45.3px; left:-4.2px; top:-4.2px; }

  nav { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:calc(100% - 30px); max-width:366px; display:flex; gap:7px; align-items:center; }
  .nav-main { flex:1; height:57px; border-radius:999px; background:rgba(255,255,255,.9); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); display:flex; justify-content:space-between; align-items:center; padding:0 4px; box-shadow:0 5px 26px rgba(0,0,0,.12); }
  .tab { width:100px; height:49px; border-radius:999px; display:grid; place-items:center; flex:none; }
  .nav-main .tab:not(.active) { width:auto; flex:1; }
  .tab.active { background:#ebebee; }
  .tab svg { width:25px; height:25px; }
  .tab.active svg { fill:var(--text); stroke:none; }
  .nav-search { width:57px; height:57px; border-radius:50%; background:rgba(255,255,255,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); display:grid; place-items:center; box-shadow:0 5px 26px rgba(0,0,0,.12); flex:none; }
  .nav-search svg { width:25px; height:25px; }

  .token.link { cursor:pointer; -webkit-tap-highlight-color:transparent; transition:opacity .15s; }
  .token.link:active { opacity:.55; }
  .stack { position:fixed; top:0; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:396px; overflow:hidden; pointer-events:none; z-index:50; }
  .stack iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fbfbfb; transform:translateX(100%); transition:transform .38s cubic-bezier(.22,.8,.3,1); box-shadow:-8px 0 30px rgba(0,0,0,.12); }
  .stack.open { pointer-events:auto; }
  .stack.open iframe { transform:translateX(0); }
  @media (prefers-reduced-motion:reduce){ .stack iframe { transition:none; } }

  .splash { position:fixed; top:0; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:396px; background:#fdfdfd; z-index:100; display:grid; place-items:center; transition:opacity .35s ease; }
  .splash.hide { opacity:0; pointer-events:none; }
  .splash svg { width:111px; height:auto; display:block; margin-top:-2%; }
  @media (prefers-reduced-motion:reduce){ .splash { transition:none; } }
</style>
</head>

<script>
(function(){
  var stack=document.getElementById('stack'), frame=document.getElementById('detail-frame'), row=document.getElementById('usdt-row');
  frame.srcdoc=new TextDecoder().decode(Uint8Array.from(atob(document.getElementById('detail-b64').textContent.trim()),function(c){return c.charCodeAt(0);}));
  function open(){ stack.classList.add('open'); frame.tabIndex=0; }
  function close(){ stack.classList.remove('open'); frame.tabIndex=-1; }
  window.__usdtClose=close;
  var sp=document.getElementById('splash');
  setTimeout(function(){ sp.classList.add('hide'); setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); },450); },4000);
  row.addEventListener('click',open);
  row.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); }});
  window.addEventListener('message',function(e){ if(e.data && e.data.type==='usdt-back') close(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
})();
</script>
